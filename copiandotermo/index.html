<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Termo</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>

    <h1>TERMO</h1>

    <div id="grid">
        <div class="row">
            <div class="cell" id="cell-0-0"></div><div class="cell" id="cell-0-1"></div><div class="cell" id="cell-0-2"></div><div class="cell" id="cell-0-3"></div><div class="cell" id="cell-0-4"></div>
        </div>
        <div class="row">
            <div class="cell" id="cell-1-0"></div><div class="cell" id="cell-1-1"></div><div class="cell" id="cell-1-2"></div><div class="cell" id="cell-1-3"></div><div class="cell" id="cell-1-4"></div>
        </div>
        <div class="row">
            <div class="cell" id="cell-2-0"></div><div class="cell" id="cell-2-1"></div><div class="cell" id="cell-2-2"></div><div class="cell" id="cell-2-3"></div><div class="cell" id="cell-2-4"></div>
        </div>
        <div class="row">
            <div class="cell" id="cell-3-0"></div><div class="cell" id="cell-3-1"></div><div class="cell" id="cell-3-2"></div><div class="cell" id="cell-3-3"></div><div class="cell" id="cell-3-4"></div>
        </div>
        <div class="row">
            <div class="cell" id="cell-4-0"></div><div class="cell" id="cell-4-1"></div><div class="cell" id="cell-4-2"></div><div class="cell" id="cell-4-3"></div><div class="cell" id="cell-4-4"></div>
        </div>
        <div class="row">
            <div class="cell" id="cell-5-0"></div><div class="cell" id="cell-5-1"></div><div class="cell" id="cell-5-2"></div><div class="cell" id="cell-5-3"></div><div class="cell" id="cell-5-4"></div>
        </div>
    </div>

    <div id="keyboard">
        <div class="key-row">
            <button onclick="handleKey('Q')">Q</button><button onclick="handleKey('W')">W</button><button onclick="handleKey('E')">E</button><button onclick="handleKey('R')">R</button><button onclick="handleKey('T')">T</button><button onclick="handleKey('Y')">Y</button><button onclick="handleKey('U')">U</button><button onclick="handleKey('I')">I</button><button onclick="handleKey('O')">O</button><button onclick="handleKey('P')">P</button>
        </div>
        <div class="key-row">
            <button onclick="handleKey('A')">A</button><button onclick="handleKey('S')">S</button><button onclick="handleKey('D')">D</button><button onclick="handleKey('F')">F</button><button onclick="handleKey('G')">G</button><button onclick="handleKey('H')">H</button><button onclick="handleKey('J')">J</button><button onclick="handleKey('K')">K</button><button onclick="handleKey('L')">L</button>
        </div>
        <div class="key-row">
            <button onclick="handleKey('ENTER')">ENTER</button><button onclick="handleKey('Z')">Z</button><button onclick="handleKey('X')">X</button><button onclick="handleKey('C')">C</button><button onclick="handleKey('V')">V</button><button onclick="handleKey('B')">B</button><button onclick="handleKey('N')">N</button><button onclick="handleKey('M')">M</button><button onclick="handleKey('BACKSPACE')">⌫</button>
        </div>
    </div>

    <script src="./script.js"></script>
</body>
</html>
